<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Homework - SH Mankge - FSL7CU</title>

    <!-- Bootstrap 3 CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap-theme.min.css">






</head>

<body>



<!-- Todo Section -->
<section id="tidList">
    <div class="container">
        <h1 class="jumbotron">To-Do | Mobile- and Web-based Software</h1>

        <ul class="nav nav-pills text-center">
            <li class="todo-tab active" onclick="selectTab(this)" data-tab-name="all">
                <a href="#">All <span class="badge" id="badge-all"></span></a>
            </li>
            <li class="todo-tab" onclick="selectTab(this)" data-tab-name="active">
                <a href="#">Active <span class="badge" id="badge-active"></span></a>
            </li>
            <li class="todo-tab" onclick="selectTab(this)" data-tab-name="inactive">
                <a href="#">Inactive <span class="badge" id="badge-inactive"></span></a>
            </li>
            <li class="todo-tab" onclick="selectTab(this)" data-tab-name="done">
                <a href="#">Done <span class="badge" id="badge-done"></span></a>
            </li>
        </ul>

        <div class="list-group" id="todo-list">
            <div class="row">
                <div class="col-xs-6 col-sm-9 col-md-10">
                    <a class="list-group-item" href="#">My first to-do of the day</a>
                </div>
                <div class="col-xs-6 col-sm-3 col-md-2 btn-group text-right">
                    <button class="btn btn-default btn-xs" title="Mark as done">
                        <i class="glyphicon glyphicon-ok"></i>
                    </button>
                    <button class="btn btn-default btn-xs" title="Mark as active">
                        <i class="glyphicon glyphicon-plus"></i>
                    </button>
                    <button class="btn btn-default btn-xs" title="Mark as inactive">
                        <i class="glyphicon glyphicon-minus"></i>
                    </button>
                    <button class="btn btn-default btn-xs" title="Remove">
                        <i class="glyphicon glyphicon-trash"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="panel panel-default">
            <div class="panel-heading">Add new to-do</div>
            <form id="new-todo-form" class="panel-body">
                <div class="input-group">
                    <input type="text" id="new-todo-title" class="form-control"
                           placeholder="Type a name for the new to-do..." autocomplete="off" autofocus="true">
                    <span class="input-group-btn">
              <button type="submit" class="btn btn-default">
                <i class="glyphicon glyphicon-plus"></i>
              </button>
            </span>
                </div>
            </form>
        </div>
    </div>
</section>
<section id="footerSection">
    <!-- Footer -->
    <footer class="text-center py-4 bg-light border-top">
        <p class="mb-0 text-muted">&copy; 2025 Homework To-Do Manager — Built with Bootstrap by SH Mankge</p>
    </footer>

</section>
<script src="todo.js" type="text/javascript"></script>
</body>
</html>
